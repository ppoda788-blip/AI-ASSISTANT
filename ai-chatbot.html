<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 420px;
      height: 620px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    #header {
      padding: 14px 18px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
    }

    #header .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #dbeafe;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600; color: #1d4ed8;
      flex-shrink: 0;
    }

    #header .name { font-size: 15px; font-weight: 600; color: #111; }
    #header .status { font-size: 12px; color: #16a34a; }

    #clear-btn {
      margin-left: auto;
      background: none; border: none;
      font-size: 12px; color: #9ca3af;
      cursor: pointer; padding: 4px 8px;
      border-radius: 6px;
    }
    #clear-btn:hover { color: #6b7280; background: #f3f4f6; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .timestamp {
      font-size: 11px; color: #9ca3af;
      text-align: center; margin: 4px 0;
    }

    .msg { display: flex; gap: 8px; max-width: 85%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }

    .bot-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: #dbeafe;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 600; color: #1d4ed8;
      flex-shrink: 0; margin-top: 2px;
    }

    .bubble {
      padding: 10px 14px;
      font-size: 14px; line-height: 1.55;
      border-radius: 16px;
    }

    .bot  .bubble { background: #f3f4f6; color: #111; border-radius: 4px 16px 16px 16px; }
    .user .bubble { background: #2563eb; color: #fff;  border-radius: 16px 4px 16px 16px; }

    .typing { display: flex; gap: 5px; align-items: center; padding: 12px 14px; }
    .typing span {
      width: 7px; height: 7px;
      border-radius: 50%; background: #9ca3af;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30%          { transform: translateY(-6px); }
    }

    #input-area {
      padding: 12px 16px;
      border-top: 1px solid #e5e7eb;
      display: flex; gap: 8px; align-items: flex-end;
      background: #fff;
    }

    #user-input {
      flex: 1; resize: none;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      background: #f9fafb;
      color: #111;
      max-height: 120px; min-height: 40px;
      line-height: 1.5; outline: none;
    }
    #user-input:focus { border-color: #2563eb; background: #fff; }

    #send-btn {
      width: 38px; height: 38px;
      border-radius: 50%; border: none;
      background: #2563eb; color: #fff;
      cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: opacity 0.15s;
    }
    #send-btn:hover { opacity: 0.85; }
    #send-btn:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>

<div id="app">
  <div id="header">
    <div class="avatar">AI</div>
    <div>
      <div class="name">AI Assistant</div>
      <div class="status">● Online</div>
    </div>
    <button id="clear-btn">Clear chat</button>
  </div>

  <div id="messages">
    <div class="timestamp">Today</div>
    <div class="msg bot">
      <div class="bot-avatar">AI</div>
      <div class="bubble">Hi there! I'm your AI assistant. How can I help you today?</div>
    </div>
  </div>

  <div id="input-area">
    <textarea id="user-input" placeholder="Message AI Assistant..." rows="1"></textarea>
    <button id="send-btn">&#9654;</button>
  </div>
</div>

<script>
  const YOUR_API_KEY = "YOUR_ANTHROPIC_API_KEY_HERE"; // 🔑 Replace this

  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');
  const clearBtn   = document.getElementById('clear-btn');
  const history    = [];

  function addMessage(role, text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    if (role === 'bot') {
      const av = document.createElement('div');
      av.className = 'bot-avatar';
      av.textContent = 'AI';
      wrap.appendChild(av);
    }
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg bot';
    wrap.id = 'typing-indicator';
    const av = document.createElement('div');
    av.className = 'bot-avatar';
    av.textContent = 'AI';
    wrap.appendChild(av);
    const bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;

    addMessage('user', text);
    history.push({ role: 'user', content: text });
    showTyping();

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': YOUR_API_KEY,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: 'You are a helpful, friendly AI assistant. Be concise and conversational. Respond in plain text without markdown formatting.',
          messages: history
        })
      });

      const data = await res.json();
      removeTyping();
      const reply = data.content?.map(b => b.text || '').join('') || 'Sorry, I could not get a response.';
      addMessage('bot', reply);
      history.push({ role: 'assistant', content: reply });

    } catch (e) {
      removeTyping();
      addMessage('bot', 'Something went wrong. Please try again.');
      console.error(e);
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }

  sendBtn.addEventListener('click', sendMessage);

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  clearBtn.addEventListener('click', () => {
    history.length = 0;
    messagesEl.innerHTML = `
      <div class="timestamp">Today</div>
      <div class="msg bot">
        <div class="bot-avatar">AI</div>
        <div class="bubble">Hi there! I'm your AI assistant. How can I help you today?</div>
      </div>`;
  });
</script>

</body>
</html>
